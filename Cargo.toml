[package]
name = "airpipe-pc"
version = "0.2.0"
edition = "2024"
description = "Airpipe PC daemon and CLI (LAN clipboard/file transfer)"

[[bin]]
name = "ap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.0"
lamco-data-control = "1.0.1"
ksni = { version = "0.3.7", features = ["blocking"] }
sha2 = "0.11.1"
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "logging",
    "std",
] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = [
    "pem",
    "ring",
] }
zstd = "0.14.3"
clap_complete = "4.6.11"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
